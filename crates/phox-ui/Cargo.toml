[package]
name = "phox-ui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A declarative, Elm-style UI framework with Flutter-style layout, drawn with phox-immediate and testable without a GPU"

[dependencies]
phox-immediate = { path = "../phox-immediate" }

[dev-dependencies]
phox-rhi = { path = "../phox-rhi" }
phox-vulkan = { path = "../phox-vulkan" }
serial_test.workspace = true
png = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
phox-metal = { path = "../phox-metal" }
