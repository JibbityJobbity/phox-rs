[package]
name = "phox-metal"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The Metal 3 backend of the Phox RHI (Apple Silicon, macOS 14+)"

[dependencies]
phox-rhi = { path = "../phox-rhi" }
log.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
spirv-cross2 = { version = "0.7", default-features = false, features = ["msl"] }

[dev-dependencies]
serial_test.workspace = true
