[workspace]
resolver = "3"
members = ["crates/phox-rhi", "crates/phox-null", "crates/phox-vulkan", "crates/phox-metal", "crates/phox-core", "crates/phox-forward", "crates/phox-immediate", "crates/phox-ui", "crates/phox-ui-host", "crates/phox-ui-nih", "crates/phox-sample"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tobj = "4"
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_lights_punctual"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serial_test = "3"
cc = "1"

# Phox is CPU-heavy in tests (software rasterizer, cluster LOD builder), so debug builds are optimised.
[profile.dev]
opt-level = 2
